# ============================================================
# 1. Namespace
# ============================================================
apiVersion: v1
kind: Namespace
metadata:
  name: petclinic
---
# ============================================================
# 2. DB ConfigMap (민감정보 제외)
# ============================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: db-config
  namespace: petclinic
data:
  SPRING_DATASOURCE_URL: "jdbc:mysql://petclinic-db-instance.cilhrftvqk7o.ap-northeast-2.rds.amazonaws.com:3306/petclinic?allowPublicKeyRetrieval=true&useSSL=false"
  SPRING_DATASOURCE_USERNAME: "admin"
---
# ============================================================
# 3. DB Secret
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: db-secret
  namespace: petclinic
type: Opaque
stringData:
  SPRING_DATASOURCE_PASSWORD: "${DB_PASSWORD_AWS}"
---
# ============================================================
# 4. GenAI Secret
# ============================================================
apiVersion: v1
kind: Secret
metadata:
  name: ai-secret
  namespace: petclinic
type: Opaque
stringData:
  API_KEY: "${GROQ_API_KEY}"
