        image: tfcoreacr01.azurecr.io/petclinic-acr:customers-service
        ports:
        - containerPort: 8081
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker,mysql"
        - name: SPRING_CLOUD_CONFIG_SERVER_GIT_DEFAULT_LABEL
