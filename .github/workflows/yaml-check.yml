name: YAML Validate & Format CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  yaml-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      # ============================================================
      # 1. YAML Format (fmt) 스타일 검사
      # ============================================================
      - name: Install and Run yamllint
        run: |
          sudo apt-get update && sudo apt-get install -y yamllint
          
          echo "=== YAML Format 스타일 검사 (경고 모드) ==="
          
          # '|| true'를 추가하여 Lint 에러가 있어도 파이프라인을 멈추지 않게 설정
          find . -path "./.github" -prune -o \( -name "*.yaml" -o -name "*.yml" \) \
          -exec yamllint -d "{extends: relaxed, rules: {line-length: disable}}" {} + || true

      # ============================================================
      # 2. Kubernetes 스키마 문법 검사 (Kubeconform)
      # ============================================================
      - name: Install and Run Kubeconform
        run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          
          echo "=== Kubeconform 구조 및 스키마 검사 ==="
          
          # 쿠버네티스 리소스 문법 오류가 있을 경우에만 실패하도록 유지
          find . -path "./.github" -prune -o \( -name "*.yaml" -o -name "*.yml" \) \
          -exec kubeconform -summary -ignore-missing-schemas {} +
