name: YAML Validate CI

on:
  push:
    branches: ["main", "develop"]
  pull_request:
    branches: ["main", "develop"]

jobs:
  yaml-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Install and Run Kubeconform
        run: |
          curl -L -o kubeconform.tar.gz https://github.com/yannh/kubeconform/releases/latest/download/kubeconform-linux-amd64.tar.gz
          tar -xzf kubeconform.tar.gz
          sudo mv kubeconform /usr/local/bin/
          
          echo "=== .github 폴더를 제외한 순수 YAML 파일만 골라서 검사 시작 ==="
          
          # xargs 대신 -exec ... + 구문을 사용하여 안전하게 파일 목록을 kubeconform의 인자로 전달합니다.
          find . -path "./.github" -prune -o \( -name "*.yaml" -o -name "*.yml" \) -exec kubeconform -summary -ignore-missing-schemas {} +
