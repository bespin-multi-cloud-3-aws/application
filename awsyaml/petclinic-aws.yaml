# 9. genai-service (포트 8084)
# ============================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: genai-service
  namespace: petclinic
spec:
  selector:
    matchLabels:
      app: genai-service
  template:
    metadata:
      labels:
        app: genai-service
    spec:
      initContainers:
      - name: wait-for-discovery
        image: curlimages/curl:latest
        command:
        - sh
        - -c
        - |
          until curl -sf http://discovery-server:8761/actuator/health; do
            echo "Waiting for discovery-server..."; sleep 5;
          done
      containers:
      - name: genai-service
        image: 906336681755.dkr.ecr.ap-northeast-2.amazonaws.com/petclinic_msa_1:genai-service-v1
        ports:
        - containerPort: 8084
        env:
        - name: SPRING_PROFILES_ACTIVE
          value: "docker"
        - name: EUREKA_CLIENT_SERVICEURL_DEFAULTZONE
          value: "http://discovery-server:8761/eureka/"
        - name: SPRING_AI_OPENAI_API_KEY
          valueFrom:
            secretKeyRef:
              name: ai-secret
              key: API_KEY
        - name: SPRING_AI_OPENAI_BASE_URL        # 추가
          value: "https://api.groq.com/openai"
        - name: SPRING_AI_OPENAI_CHAT_OPTIONS_MODEL
          value: "llama-3.3-70b-versatile"
        readinessProbe:
          httpGet:
            path: /actuator/health
            port: 8084
          initialDelaySeconds: 30
          periodSeconds: 10
        resources:
          requests:
            memory: "512Mi"
            cpu: "100m"
          limits:
            memory: "1Gi"
            cpu: "300m"

---
apiVersion: v1
kind: Service
metadata:
  name: genai-service
  namespace: petclinic
spec:
  selector:
    app: genai-service
  ports:
  - port: 8084
    targetPort: 8084
